<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="/qrcode/qrCodeStyles.css">
  <meta name="google" content="notranslate" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EscolaDIRETA | QR Code</title>
</head>
<body>

  <header id="header">
    <span id="lastUpdate"><b>Última atualização:</b> N/D</span>
    <span id="serialInfo"></span>
  </header>

  <div id="main">
    <div class="warning"></div>
    <h1>Leia o QR Code abaixo <br> para solicitar a retirada do(a) aluno(a):</h1>

    <div id="content">
      <div id="loading">
        <p>Aguarde</p>
        <small>Um novo QR Code está sendo gerado.</small>
      </div>

      <img
        id="qrcode"
        src="https://back-end-2vzw.onrender.com/api/qrcode"
        alt="QR Code"
        />
    </div>

  </div>
  <footer>
    <span>ESCOLA<b>DIRETA</b> System<sup style="font-size: 9px;">®</sup> | Check-out Module - 2025</span>
  </footer>

  <script src="/qrcode/qrCodeScripts.js"></script>
  <script>
    const serialNumberCurrent = urlParams.get('serialNumber');

    /*
    const serialNumberFixed = "01010104";
    if (serialNumberCurrent !== serialNumberFixed) {
      urlParams.set('serialNumber', serialNumberFixed);
      const newUrl = `${window.location.pathname}?${urlParams.toString()}`;
      window.location.replace(newUrl);
    }
    */

    const serial = typeof serialNumberFixed !== "undefined" 
      ? serialNumberFixed
      : serialNumberCurrent;

    document.title = serial
      ? `EscolaDIRETA | ${serial}`
      : 'EscolaDIRETA | QR Code';
  </script>
</body>
</html>
